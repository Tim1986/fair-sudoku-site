<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Fair Sudoku</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E7C66">
<script>try{var t=localStorage.getItem('fs-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
.nf{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:40px 0;}
.nf .code{font-family:"Spline Sans Mono",monospace; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
.nf h1{font-family:"Newsreader",serif; font-style:italic; font-weight:600; font-size:2.4rem; margin:0;}
.nf p{color:var(--muted); max-width:46ch; line-height:1.6; margin:0;}
.nf a{display:inline-block; margin-top:8px; background:var(--accent); color:var(--bg); text-decoration:none; font-weight:600; padding:11px 20px; border-radius:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="nf">
    <div class="code">404 · no solution</div>
    <h1>This square doesn’t add up</h1>
    <p>The page you were after isn’t here — a rare unsolvable state. Every puzzle at Fair Sudoku,
    on the other hand, is guaranteed to have exactly one.</p>
    <a href="/">Play today’s puzzle</a>
  </div>
</div>
</body>
</html>
