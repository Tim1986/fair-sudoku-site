name: Deploy site + daily NYT check
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * *"   # daily, after NYT's puzzle rollover
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the public mirror hosts Pages; this self-skips in the private source repo.
    if: github.repository == 'Tim1986/fair-sudoku-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch today's NYT puzzles
        run: node tools/nyt-check.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
